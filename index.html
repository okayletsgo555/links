<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상태창 + 본문 통합 자동 변환기 💖💬</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #f0f4f8; max-width: 800px; margin: auto; color: #333; }
    h2 { color: #555682; text-align: center; }
    .box { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
    textarea { width: 100%; height: 320px; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 13px; line-height: 1.6; }
    button { width: 100%; padding: 12px; background: #A8CAE0; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; margin-top: 5px; }
    button:hover { background: #8bb3cb; }
    .btn-copy { background: #DBB9CC; margin-top: 10px; }
    .btn-copy:hover { background: #c29cb3; }
  </style>
</head>
<body>

  <h2>✨ 상태창 + 본문 통합 변환기 ✨</h2>

  <div class="box">
    <label><b>1. 상태창과 본문 텍스트를 복붙하세요 (여러 세트 가능):</b></label>
    <textarea id="inputText" placeholder="상태창 텍스트 [ T1 | ... ] 와 본문을 순서대로 붙여넣으세요."></textarea>
    <button onclick="convertAll()">⚡ 최종 통합 HTML 생성하기!</button>
  </div>

  <div class="box">
    <label><b>2. 완성된 HTML (복사해서 사용하세요):</b></label>
    <textarea id="outputText" readonly></textarea>
    <button class="btn-copy" onclick="copyResult()">📋 코드 복사하기</button>
  </div>

<script>
// 1. 단일 상태창 텍스트 배열 -> HTML 변환 함수
function buildStatusHtml(statusLines) {
  let slotId = "T1", datetime = "2014.04.15 09:20", location = "오사카행 신칸센 객실";
  let chipBlue = "🎖️ 블루윙스 2위", chipGreen = "📈 평판 A", chipPink = "일정: 🚄 5-6월 교류전 원정";
  let subInfo1 = "👤 신분: 프런트 스태프", subInfo2 = "💘 타겟: -";
  let missionText = "목적지 도착까지 선수들이 편안하게 이동할 수 있도록 지원해주세요!";
  let chatterText = "야, 저기 자리, 분명 뭔가 재밌는 일 벌어지고 있다니까. (´∀｀)";
  let members = [];

  statusLines.forEach(line => {
    let cleanLine = line.replace(/🏆/g, '🎖️').replace(/🚩/g, '🍥');

    if (cleanLine.startsWith('[')) {
      const parts = cleanLine.replace('[', '').replace(']', '').split('|').map(p => p.trim());
      if (parts[0]) slotId = parts[0];
      
      if (parts[1] && parts[2]) {
        datetime = `${parts[1]} ${parts[2]}`;
      } else if (parts[1]) {
        datetime = parts[1];
      }

      if (parts[4]) {
        const icon = parts[3] ? parts[3] + ' ' : '';
        location = (icon + parts[4]).replace('📍', '').replace('→', '&rarr;').trim();
      } else if (parts[3]) {
        location = parts[3].replace('📍', '').replace('→', '&rarr;').trim();
      }
    } else if (cleanLine.includes('REPORT') || cleanLine.includes('REPORT:')) {
      return;
    } else if (cleanLine.includes('🎖️') || cleanLine.includes('📈') || cleanLine.includes('일정')) {
      const parts = cleanLine.split('|').map(p => p.trim());
      if (parts[0]) chipBlue = parts[0];
      if (parts[1]) chipGreen = parts[1];
      if (parts[2]) chipPink = parts[2];
    } else if (cleanLine.includes('👤') || cleanLine.includes('💘')) {
      const parts = cleanLine.split('|').map(p => p.trim());
      if (parts[0]) subInfo1 = parts[0];
      if (parts[1]) subInfo2 = parts[1];
    } else if (cleanLine.includes('MAIN MISSION') || cleanLine.includes('🍥') || cleanLine.toUpperCase().includes('MISSION:')) {
      missionText = cleanLine
        .replace(/🍥/g, '')
        .replace(/MAIN\s*MISSION/gi, '')
        .replace(/MISSION/gi, '')
        .replace(/^[\s:]+/, '')
        .trim();
    } else if (cleanLine.includes('💬') || cleanLine.toUpperCase().includes('CHATTER:')) {
      chatterText = cleanLine.replace('💬', '').replace(/CHATTER:/gi, '').trim();
    } else if (cleanLine.includes('|')) {
      const parts = cleanLine.split('|').map(p => p.trim());
      if (parts.length >= 2) {
        const name = parts[0];
        const status = parts[parts.length - 1];
        const tags = parts.slice(1, parts.length - 1);
        members.push({ name, tags, status });
      }
    }
  });

  let memberListHtml = members.map(m => {
    let tagsHtml = m.tags.map(t => `<span class="m-tag">${t}</span>`).join(' ');
    return `<div class="cps-member-card">
<div class="member-top"><span class="m-name">${m.name}</span> ${tagsHtml}</div>
<div class="m-status">${m.status}</div>
</div>`;
  }).join('\n');

  return `<div class="custom-pixel-status"><!-- 1. 상단 레트로 칩 헤더 -->
<div class="cps-header"><span class="cps-slot-id">${slotId}</span> <span class="cps-datetime">${datetime}</span></div>
<div class="cps-location">📍 ${location} <span class="cps-gender"></span></div>
<!-- 2. 미니 스태터스 칩 모음 -->
<div class="cps-chips"><span class="cps-chip blue">${chipBlue}</span> <span class="cps-chip green">${chipGreen}</span> <span class="cps-chip pink">${chipPink}</span></div>
<div class="cps-sub-info"><span>${subInfo1}</span> <span>${subInfo2}</span></div>
<!-- 3. 메인 미션 박스 (레트로 골드 픽셀) -->
<div class="cps-mission-box">
<div class="mission-tag">🍥 MAIN MISSION</div>
<div class="mission-text">${missionText}</div>
</div>
<hr class="dashed-hr" data-ke-style="style1" /><!-- 4. 캐릭터 슬롯 리스트 -->
<div class="cps-member-list">
${memberListHtml}
</div>
<hr class="dashed-hr" data-ke-style="style1" /><!-- 5. 하단 코멘트 말풍선 -->
<div class="cps-chatter-box">💬 ${chatterText}</div>
</div>
<div>
<style>
.custom-pixel-status {
  width: 100%;
  max-width: 320px;
  margin: 15px auto;
  padding: 13px 11px;
  background-image: url('https://i.imgur.com/qMtnWlS.jpeg');
  background-color: #ffffff;
  background-size: cover;
  border: 1px solid #e5e5e5;
  box-shadow: 2px 2px 0px #b0b0b0;
  font-size: 12px;
  line-height: 1.6;
  color: #666666;
  box-sizing: border-box !important;
  text-shadow: -1px -1px 0 #ffffff, 1px -1px 0 #ffffff, -1px 1px 0 #ffffff, 1px 1px 0 #ffffff;
}
.cps-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px; }
.cps-slot-id { background-color: #FEF7FB; color: #ffffff; font-weight: bold; font-size: 9.5px; padding: 1px 5px; border-radius: 2px; text-shadow: -0.5px -0.5px 0 #888888, 0.5px -0.5px 0 #888888, -0.5px 0.5px 0 #888888, 0.5px 0.5px 0 #888888; }
.cps-datetime { font-size: 10px; color: #666666; font-weight: bold; }
.cps-location { font-size: 11px; font-weight: bold; color: #555555; margin-bottom: 6px; }
.cps-gender { font-weight: normal; color: #70a7ce; }
.cps-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 4px; }
.cps-chip { padding: 1px 5px; font-size: 9.5px; border: 1px solid #707070; border-radius: 3px; background-color: #ffffff; }
.cps-chip.blue { border-color: #A8CAE0; color: #A8CAE0; }
.cps-chip.green { border-color: #9FCFA0; color: #9FCFA0; }
.cps-chip.pink { border-color: #DBB9CC; color: #DBB9CC; }
.cps-sub-info { display: flex; justify-content: space-between; font-size: 9.5px; color: #666666; margin-bottom: 8px; padding: 0 2px; }
.cps-mission-box { background-color: #FEF7FB; border: 1px solid #F6D9E9; padding: 6px 8px; border-radius: 4px; margin-bottom: 10px; box-shadow: 1px 1px 0px #F2DCE9; }
.mission-tag { font-size: 9px; font-weight: bold; color: #E8A5CD; }
.mission-text { font-size: 11px; color: #666666; }
.cps-member-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; font-size: 11px; }
.cps-member-card { background: rgba(255, 255, 255, 0.85); border: 1px solid #c0c0c0; padding: 5px 8px; border-radius: 3px; box-shadow: 1px 1px 0px #e0e0e0; }
.member-top { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 3px; margin-bottom: 3px; }
.m-name { font-weight: bold; color: #555555; }
.m-tag { background-color: #F5F9FD; border: 1px solid #d0dbe5; color: #556b82; font-size: 8.5px; padding: 0 4px; border-radius: 2px; text-shadow: none; font-size: 9.5px; }
.m-status { font-size: 11px; color: #666666; padding-left: 2px; margin-bottom: 3px; }
.cps-chatter-box { background-color: #F7FAFF; border: 1px solid #C4D3ED; padding: 6px 8px; font-size: 11px; color: #3b6282; border-radius: 4px; }
hr.dashed-hr { border: none; border-top-style: dashed; border-top-width: 0.8px; border-top-color: #e5e5e5; width: 100%; margin-bottom: 10px; }
</style>
</div>`;
}

// 2. 단일 본문 텍스트 배열 -> HTML 변환 함수
function buildBodyHtml(bodyLines) {
  let blocks = [];
  let currentBlock = [];

  bodyLines.forEach(line => {
    if (line.startsWith('(') || line.startsWith('（')) {
      if (currentBlock.length > 0) {
        currentBlock.push(line);
      } else {
        blocks.push([line]);
      }
    } else {
      if (currentBlock.length > 0) {
        blocks.push(currentBlock);
        currentBlock = [];
      }
      currentBlock.push(line);
    }
  });

  if (currentBlock.length > 0) {
    blocks.push(currentBlock);
  }

  const resultBlocks = blocks.map(block => {
    const mainText = block[0];
    const isDialogue = mainText.includes('｜') || mainText.includes('|') || mainText.includes('「') || mainText.includes('『');

    if (isDialogue) {
      const dialogueLines = block.map(l => {
        // '속마음:' 으로 시작할 경우 글자 크기 축소 (색상은 기본 대사 색 유지)
        if (l.trim().startsWith('속마음:')) {
          return `<span style="font-size: 0.88em;">${l}</span>`;
        }
        return l;
      }).join('<br>');

      return `<div style="margin-bottom: 22px; line-height: 1.8;">${dialogueLines}</div>`;
    } else {
      // 지문의 경우 '속마음:' 처리
      let formattedText = mainText;
      if (mainText.trim().startsWith('속마음:')) {
        formattedText = `<span style="font-size: 0.88em;">${mainText}</span>`;
      }
      return `<div style="color: #888888; margin-bottom: 22px; line-height: 1.8;">${formattedText}</div>`;
    }
  });

  return resultBlocks.join('\n');
}

// 3. 메인 변환 로직 (통합 처리)
function convertAll() {
  const rawInput = document.getElementById('inputText').value;
  const lines = rawInput.split('\n').map(l => l.trim()).filter(l => l !== '');

  // 상태창 시작점([ T로 시작하는 라인) 기준으로 세트 분리
  let rawSets = [];
  let currentSet = [];

  lines.forEach(line => {
    if (line.startsWith('[') && line.includes('|')) {
      if (currentSet.length > 0) {
        rawSets.push(currentSet);
        currentSet = [];
      }
    }
    currentSet.push(line);
  });
  if (currentSet.length > 0) {
    rawSets.push(currentSet);
  }

  // 각 세트별 가공
  let processedSets = rawSets.map(setLines => {
    let statusLines = [];
    let bodyLines = [];
    let isStatusPart = true;

    // 상태창 부분과 본문 부분 분리
    setLines.forEach(line => {
      // 본문의 첫 대사/지문 조건 감지 시 본문 모드로 전환
      if (isStatusPart && (line.includes('｜') || line.includes('|') || line.includes('「') || line.includes('『')) && !line.startsWith('[')) {
        // 단, 상태창 파싱용 키워드가 아닐 때만 본문으로 인식
        if (!line.includes('REPORT') && !line.includes('MAIN MISSION') && !line.includes('CHATTER')) {
          isStatusPart = false;
        }
      }

      if (isStatusPart) {
        statusLines.push(line);
      } else {
        bodyLines.push(line);
      }
    });

    let statusHtml = buildStatusHtml(statusLines);
    let bodyHtml = buildBodyHtml(bodyLines);

    // 💡 3. 상태창 앞 <br><br>, 본문 뒤 <br><br> 적용
    return `<br><br>\n${statusHtml}\n${bodyHtml}\n<br><br>`;
  });

  // 💡 4. 세트가 여러 개일 때 구분선(HR) 연결
  const divider = '\n<div style="color: #888888; margin-bottom: 22px; line-height: 1.8;"><hr contenteditable="false" data-ke-type="horizontalRule" data-ke-style="style6" /></div>\n';
  const finalResultHtml = processedSets.join(divider);

  document.getElementById('outputText').value = finalResultHtml;
}

function copyResult() {
  const output = document.getElementById('outputText');
  output.select();
  document.execCommand('copy');
  alert('클립보드에 변환된 통합 HTML이 복사되었습니다! 🎉');
}
</script>

</body>
</html>
